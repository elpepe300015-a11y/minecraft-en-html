<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atrapado - Demo de Backrooms</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Share Tech Mono', monospace;
    }

    body {
        background-color: #f6f58a; /* amarillo Backrooms */
        background-image: url('https://i.imgur.com/8v1ZnBt.jpg'); /* textura de paredes */
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        overflow: hidden;
        animation: slightShake 10s infinite linear;
    }

    @keyframes slightShake {
        0% { transform: translate(0px, 0px); }
        25% { transform: translate(-1px, 1px); }
        50% { transform: translate(1px, -1px); }
        75% { transform: translate(-1px, 1px); }
        100% { transform: translate(0px, 0px); }
    }

    .container {
        background-color: rgba(0,0,0,0.7);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 0 20px #000;
        max-width: 600px;
        animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h1 {
        font-size: 3rem;
        margin-bottom: 20px;
        color: #ffff00;
        text-shadow: 2px 2px 0 #000;
    }

    p {
        font-size: 1.2rem;
        margin-bottom: 30px;
        line-height: 1.5;
        color: #fff;
    }

    .btn {
        display: inline-block;
        padding: 15px 30px;
        font-size: 1.2rem;
        color: #fff;
        background-color: #ff0000;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
        transition: 0.3s;
    }

    .btn:hover {
        background-color: #cc0000;
        transform: scale(1.05);
    }

    footer {
        margin-top: 40px;
        font-size: 0.9rem;
        color: #fff;
        opacity: 0.7;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>Atrapado</h1>
        <p>Te encuentras atrapado en las Backrooms. Pasillos infinitos, luces parpadeantes y algo acechando.  
        Esta es solo la demo. El juego completo sale en marzo.</p>
        <a class="btn" href="https://www.roblox.com/games/TU_ID_DE_JUEGO" target="_blank">Jugar en Roblox</a>
        <footer>Demo disponible temporalmente | Juego completo en marzo</footer>
    </div>
</body>
</html>
